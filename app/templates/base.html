<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookAndApple — поиск и рекомендации книг</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #1f2933;
            --muted: #616e7c;
            --accent: #2f855a;
            --accent-dark: #276749;
            --border: #e4e7eb;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(31, 41, 51, 0.08), 0 8px 24px rgba(31, 41, 51, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
        .site-header {
            background-color: var(--accent);
            color: #ffffff;
            box-shadow: var(--shadow);
        }

        .site-header__inner {
            max-width: 1080px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .site-header a {
            color: #ffffff;
            text-decoration: none;
        }

        .site-header a:hover {
            text-decoration: underline;
        }

        .site-header__brand {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .site-header__tagline {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }

        .hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            margin-bottom: 32px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 1.75rem;
            line-height: 1.25;
        }

        .hero p {
            margin: 0 0 24px;
            color: var(--muted);
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
        }

        .field input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--text);
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 133, 90, 0.18);
        }

        .search-form button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .search-form button:hover {
            background-color: var(--accent-dark);
        }
        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            margin: 0 0 20px;
            font-size: 1.35rem;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .book-card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(31, 41, 51, 0.14);
        }

        .book-cover {
            background-color: #edf2f7;
        }

        .book-cover img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        .book-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 14px 16px 18px;
        }

        .book-title {
            margin: 0;
            font-size: 1rem;
            line-height: 1.35;
        }

        .book-author {
            margin: 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .book-description {
            margin: 0;
            font-size: 0.85rem;
            color: var(--muted);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty {
            padding: 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .notice {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px 28px;
        }

        .notice h1 {
            margin: 0 0 12px;
            font-size: 1.4rem;
        }

        .site-footer {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 20px 40px;
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 720px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            .search-form button {
                width: 100%;
            }

            .hero {
                padding: 24px;
            }

            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__brand" href="/">BookAndApple</a>
            <span class="site-header__tagline">поиск и рекомендации книг</span>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        Данные и обложки — Open Library (Internet Archive).
    </footer>
</body>
</html>
